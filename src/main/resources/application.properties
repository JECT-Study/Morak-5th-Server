spring.application.name=morak-5th-server

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

morak.auth.kakao.client-id=${KAKAO_REST_API_KEY:}
morak.auth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
morak.auth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/api/auth/callback/kakao}
morak.auth.google.client-id=${GOOGLE_CLIENT_ID:}
morak.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
morak.auth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/api/auth/callback/google}
morak.auth.jwt.secret=${JWT_SECRET:}
morak.auth.jwt.access-token-validity=PT30M
morak.auth.jwt.refresh-token-validity=P30D
# TODO(D-3): temporary. true lets a withdrawn social account sign up again as a new user.
morak.auth.allow-rejoin=${AUTH_ALLOW_REJOIN:false}

# Retain expired tokens for 7 days, then delete daily at 03:00 Asia/Seoul. Use '-' to disable cron.
morak.auth.refresh-token-cleanup.retention=${REFRESH_TOKEN_CLEANUP_RETENTION:P7D}
morak.auth.refresh-token-cleanup.cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}

# Challenge daily batch (start processing, later auto-discard) at 00:00 Asia/Seoul. Use '-' to disable cron.
morak.challenge.daily.cron=${CHALLENGE_DAILY_CRON:0 0 0 * * *}

morak.chat.ws.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:3000}

# Production runs Redis in the same docker compose as the app (host: redis).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=morak

spring.flyway.enabled=true
spring.flyway.schemas=morak
spring.flyway.default-schema=morak
spring.flyway.create-schemas=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
morak.challenge.cover-storage.enabled=${CHALLENGE_COVER_STORAGE_ENABLED:false}
morak.challenge.cover-storage.project-url=${SUPABASE_PROJECT_URL:}
morak.challenge.cover-storage.api-key=${SUPABASE_STORAGE_API_KEY:}
morak.challenge.cover-storage.bucket=${SUPABASE_CHALLENGE_COVER_BUCKET:}

# Expo push delivery. Keep disabled locally; the access token is only needed if Expo enhanced security is on.
morak.push.expo.enabled=${PUSH_EXPO_ENABLED:false}
morak.push.expo.send-url=${PUSH_EXPO_SEND_URL:https://exp.host/--/api/v2/push/send}
morak.push.expo.receipts-url=${PUSH_EXPO_RECEIPTS_URL:https://exp.host/--/api/v2/push/getReceipts}
morak.push.expo.access-token=${EXPO_ACCESS_TOKEN:}
morak.push.expo.receipt-delay=${PUSH_EXPO_RECEIPT_DELAY:PT15M}
