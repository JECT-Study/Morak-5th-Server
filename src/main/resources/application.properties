spring.application.name=morak-5th-server

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

morak.auth.kakao.client-id=${KAKAO_REST_API_KEY:}
morak.auth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
morak.auth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/auth/login/kakao/callback}
morak.auth.oauth.state-cookie-secure=${OAUTH_STATE_COOKIE_SECURE:false}
morak.auth.jwt.secret=${JWT_SECRET:}
morak.auth.jwt.access-token-validity=PT30M
morak.auth.jwt.refresh-token-validity=P30D

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=morak

spring.flyway.enabled=true
spring.flyway.schemas=morak
spring.flyway.default-schema=morak
spring.flyway.create-schemas=true
