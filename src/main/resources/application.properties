spring.application.name=morak-5th-server

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

morak.auth.kakao.client-id=${KAKAO_REST_API_KEY:}
morak.auth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
morak.auth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/api/auth/callback/kakao}
morak.auth.jwt.secret=${JWT_SECRET:}
morak.auth.jwt.access-token-validity=PT30M
morak.auth.jwt.refresh-token-validity=P30D

# Retain expired tokens for 7 days, then delete daily at 03:00 Asia/Seoul. Use '-' to disable cron.
morak.auth.refresh-token-cleanup.retention=${REFRESH_TOKEN_CLEANUP_RETENTION:P7D}
morak.auth.refresh-token-cleanup.cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}

morak.chat.ws.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:3000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=morak

spring.flyway.enabled=true
spring.flyway.schemas=morak
spring.flyway.default-schema=morak
spring.flyway.create-schemas=true
