# Test-only overrides, layered on top of src/main/resources/application.properties.
# Keep the 00:00 KST challenge batch off so a test run that crosses midnight does not mutate shared test data.
# Tests that exercise the batch call StartDueChallengesService directly.
morak.challenge.daily.cron=-
# Keep the 12:00 KST noon auto-approve off for the same reason. Tests call AutoApproveCertificationsService directly.
morak.certification.noon.cron=-
morak.certification.expel.cron=-
